- name: 'Set build facts'
  set_fact:
    resource_name: '{{ params["ResourceName"] }}'
    build_tag: 'build-{{ params["ResourceName"] }}.b{{ params["BuildId"] }}'

- name: 'Terminate leftover build instances from previous runs'
  environment: '{{ params }}'
  shell: |
    set -euo pipefail
    instance_ids="$(aws ec2 describe-instances \
        --filters "Name=tag:Purpose,Values=ami-build" \
                  "Name=tag:ResourceName,Values={{ resource_name }}" \
                  "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query 'Reservations[].Instances[].InstanceId' \
        --output text)"
    if [[ -n "${instance_ids}" ]]; then
      aws ec2 terminate-instances --instance-ids ${instance_ids}
    else
      echo "No leftover instances"
    fi

- name: 'Create temporary build directory'
  tempfile:
    state: directory
    suffix: build
  register: build_dir

- name: 'Set SSH file paths'
  set_fact:
    private_key_file: '{{ build_dir.path }}/{{ build_tag }}.pem'
    known_hosts_file: '{{ build_dir.path }}/known_hosts'

- name: 'Detect EC2 instance metadata service'
  uri:
    url: 'http://169.254.169.254/latest/api/token'
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: '60'
    timeout: 2
  register: imds
  failed_when: false

- name: 'Builder facts from instance metadata'
  when: imds.status | default(0) == 200
  block:
    - name: 'Get current instance metadata'
      ec2_metadata_facts:
      retries: 5
      delay: 10
      register: result
      until: result is not failed

    - name: 'Set facts from current instance'
      set_fact:
        ami_id: '{{ ansible_ec2_ami_id }}'
        region: '{{ ansible_ec2_placement_region }}'
        instance_profile_arn: '{{ ansible_ec2_iam_info_instanceprofilearn }}'
        mac_key: "ansible_ec2_network_interfaces_macs_{{ ansible_ec2_mac | replace(':', '_') }}"

    - name: 'Set network facts from current instance'
      set_fact:
        vpc_id: "{{ hostvars['localhost'][mac_key + '_vpc_id'] }}"
        subnet_id: "{{ hostvars['localhost'][mac_key + '_subnet_id'] }}"
        ssh_source:
          group_id: "{{ hostvars['localhost'][mac_key + '_security_group_ids'].split(',')[0] }}"

- name: 'Builder facts from workstation (no instance metadata)'
  when: imds.status | default(0) != 200
  block:
    - name: 'Set region from params'
      set_fact:
        region: '{{ params["AWS_DEFAULT_REGION"] }}'

    - name: 'Find builder subnet'
      ec2_vpc_subnet_info:
        region: '{{ region }}'
        subnet_ids: '{{ [builder_subnet_id] if builder_subnet_id is defined else omit }}'
        filters: '{{ omit if builder_subnet_id is defined else {"tag:Name": "*PrivateSubnet1A"} }}'
      register: builder_subnets

    - name: 'Find builder VPC'
      ec2_vpc_net_info:
        region: '{{ region }}'
        vpc_ids: '{{ builder_subnets.subnets[0].vpc_id }}'
      register: builder_vpcs

    - name: 'Set network facts from builder subnet'
      set_fact:
        vpc_id: '{{ builder_subnets.subnets[0].vpc_id }}'
        subnet_id: '{{ builder_subnets.subnets[0].subnet_id }}'
        ssh_source:
          cidr_ip: '{{ builder_vpcs.vpcs[0].cidr_block }}'

    - name: 'Find latest Amazon Linux 2023 AMI'
      amazon.aws.ec2_ami_info:
        region: '{{ region }}'
        owners: amazon
        filters:
          name: 'al2023-ami-2023.*-kernel-*-x86_64'
          state: available
          architecture: x86_64
      register: al2023_amis
      when: builder_ami_id is not defined

    - name: 'Set base AMI id'
      set_fact:
        ami_id: "{{ builder_ami_id | default((al2023_amis.images | sort(attribute='creation_date'))[-1].image_id, true) }}"

    - name: 'Set instance profile for temporary instance'
      set_fact:
        instance_profile_arn: '{{ builder_instance_profile_arn }}'
      when: builder_instance_profile_arn is defined

- debug:
    msg: 'Building {{ build_tag }} from {{ ami_id }} in {{ region }} ({{ vpc_id }}/{{ subnet_id }})'

- name: 'Ensure security group allowing SSH from build server'
  ec2_group:
    name: 'AMI-Build-SG'
    description: 'Allow access from build server'
    vpc_id: '{{ vpc_id }}'
    region: '{{ region }}'
    purge_rules: no
    purge_rules_egress: no
    purge_tags: no
    rules:
      - "{{ {'proto': 'tcp', 'ports': [22], 'rule_desc': 'Allow SSH for building'} | combine(ssh_source) }}"
  register: ami_sg

- name: 'Set AMI build security group ID'
  set_fact:
    sg_group_id: '{{ ami_sg.group_id }}'

- name: 'Read builder config from Parameter Store'
  environment: '{{ params }}'
  shell: |
    config="$(aws ssm get-parameter \
                --name '/install/config' \
                --query 'Parameter.Value' \
                --output text 2>/dev/null || echo '{}')"
    echo "${config}" \
      | jq -r '.builder."associate-public-ip-address" | if . == null then true else . end | tostring' \
      || echo "True"
  register: builder_public_ip
  changed_when: false

- name: 'Set public IP assignment'
  set_fact:
    assign_public_ip: '{{ builder_public_ip.stdout_lines | last | bool }}'

- debug:
    msg: 'Assign public IP: {{ assign_public_ip }}'

- name: 'Get AWS account ID'
  aws_caller_info:
    region: '{{ region }}'
  register: caller_info

- name: 'Create KMS key for EBS encryption'
  community.aws.kms_key:
    alias: 'alias/ami-build-{{ resource_name }}'
    description: 'KMS key for AMI build encryption - {{ resource_name }}'
    region: '{{ region }}'
    enabled: yes
    state: present
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "Enable IAM User Permissions",
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::{{ caller_info.account }}:root"
            },
            "Action": "kms:*",
            "Resource": "*"
          },
          {
            "Sid": "Allow use of the key for EC2",
            "Effect": "Allow",
            "Principal": {
              "Service": "ec2.amazonaws.com"
            },
            "Action": [
              "kms:Decrypt",
              "kms:Encrypt",
              "kms:ReEncrypt*",
              "kms:GenerateDataKey*",
              "kms:CreateGrant",
              "kms:DescribeKey"
            ],
            "Resource": "*"
          }
        ]
      }
    tags:
      ResourceName: '{{ resource_name }}'
      Purpose: 'ami-build'
  register: kms_key_result

- debug:
    msg: 'KMS Key ID: {{ kms_key_result.key_id }}'

- name: 'AMI Creation'
  block:
   - name: 'Delete key pair if exists'
     ec2_key:
       name: '{{ build_tag }}'
       region: '{{ region }}'
       state: absent

   - name: 'Create new temporary key pair'
     ec2_key:
       name: '{{ build_tag }}'
       region: '{{ region }}'
     register: ec2_key_result

   - name: 'Save private key'
     copy:
       content: '{{ ec2_key_result.key.private_key }}'
       dest: '{{ private_key_file }}'
       mode: '0600'

   - name: 'Launch temporary instance'
     amazon.aws.ec2_instance:
       network:
         assign_public_ip: '{{ assign_public_ip }}'
       region: '{{ region }}'
       key_name: '{{ build_tag }}'
       security_group: '{{ sg_group_id }}'
       instance_type: m5.xlarge
       iam_instance_profile: '{{ instance_profile_arn | default(omit) }}'
       vpc_subnet_id: '{{ subnet_id }}'
       image_id: '{{ ami_id }}'
       wait: yes
       wait_timeout: 500
       exact_count: 1
       volumes:
        - device_name: /dev/xvda
          ebs:
            volume_size: 150
            delete_on_termination: true
            encrypted: true
            kms_key_id: '{{ kms_key_result.key_id }}'
       tags:
        Name: 'AMI-{{ resource_name }}-{{ params["BuildId"] }}'
        ResourceName: '{{ resource_name }}'
        BuildId: '{{ params["BuildId"] }}'
        Purpose: 'ami-build'
     register: ami_instance

   - name: 'Set build instance facts'
     set_fact:
       build_instance_id: '{{ ami_instance.instances.0.instance_id }}'
       build_instance_ip: '{{ ami_instance.instances.0.network_interfaces.0.private_ip_address }}'

   - debug:
       msg: 'Build instance {{ build_instance_id }} at {{ build_instance_ip }}'

   - name: 'Add host to group'
     add_host:
       name: '{{ build_instance_ip }}'
       groups: 'just_created'
       ansible_connection: 'ssh'
       ansible_ssh_private_key_file: '{{ private_key_file }}'
       ansible_ssh_common_args: '-o UserKnownHostsFile={{ known_hosts_file }}'
       ansible_user: 'ec2-user'

   - name: 'Wait for SSH to be ready on {{ build_instance_ip }}'
     wait_for:
       host: '{{ build_instance_ip }}'
       port: 22
       search_regex: 'OpenSSH'
       timeout: 300

   - name: 'Trust new host'
     shell: 'ssh-keyscan -p 22 {{ build_instance_ip }} > {{ known_hosts_file }}'

   - name: 'Copy certificates to target'
     shell: |
        set -euo pipefail
        remote="ec2-user@{{ build_instance_ip }}"
        ssh_opts="-i {{ private_key_file }} -o UserKnownHostsFile={{ known_hosts_file }}"

        if [[ -z "$(find /opt/cert -maxdepth 1 -type f 2>/dev/null)" ]]; then
          echo "No certificates in /opt/cert, skipping"
          exit 0
        fi

        scp ${ssh_opts} -r /opt/cert "${remote}:/tmp/cert"
        ssh ${ssh_opts} "${remote}" '
          set -e
          sudo mkdir -p /opt/cert
          sudo cp /tmp/cert/* /etc/pki/ca-trust/source/anchors/
          sudo cp /tmp/cert/* /opt/cert/
          sudo update-ca-trust extract
        '

   - name: 'Execute installation roles'
     include_role:
       name: '{{ install_role }}'
       apply:
         become: true
         delegate_to: '{{ groups.just_created[0] }}'
         vars:
           ansible_python_interpreter: "/usr/bin/python3"
     with_items: '{{ installation_roles }}'
     loop_control:
       loop_var: install_role
     when: installation_roles is defined

   - name: 'Create AMI'
     ec2_ami:
       instance_id: '{{ build_instance_id }}'
       region: '{{ region }}'
       state: present
       description: 'This was provisioned for {{ build_tag }}'
       name: '{{ build_tag }}'
       wait: yes
       root_device_name: /dev/xvda
       device_mapping:
         - device_name: /dev/xvda
           volume_size: 150
           volume_type: gp3
           delete_on_termination: true
           encrypted: true
       tags:
         Name: '{{ build_tag }}'
         ResourceName: '{{ resource_name }}'
         BuildId: '{{ params["BuildId"] }}'
     register: amioutput

   - name: 'Add AMI Id to artifacts'
     include_role:
       name: alpha-build-lib/add-artifact
     vars:
       artifact_key: 'AmiId'
       artifact_value: '{{ amioutput.image_id }}'

   - name: 'Print AMI data'
     debug:
       var: amioutput

  always:
    - name: 'Terminate temporary instance'
      ec2_instance:
        state: absent
        region: '{{ region }}'
        instance_ids: '{{ build_instance_id }}'
      when: build_instance_id is defined

    - name: 'Remove temporary key pair'
      ec2_key:
        name: '{{ build_tag }}'
        region: '{{ region }}'
        state: absent

    - name: 'Delete temporary build directory'
      file:
        path: '{{ build_dir.path }}'
        state: absent
